# Installed to /etc/nginx/sites-available/weedwatch by setup-web-server.sh
# Replace APP_DOMAIN before install or pass DOMAIN= to the setup script.

server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN;

    root /var/www/weedwatch;
    index index.html;

    location = /prototype {
        return 301 /prototype/;
    }
    location = /prototype/admin {
        return 301 /prototype/admin/;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
