# Default server: works with Elastic IP or public DNS (no TLS). setup-web-server.sh --ip-only

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/weedwatch;
    index index.html;

    # Next static export uses trailing slashes (out/prototype/index.html)
    location = /prototype {
        return 301 /prototype/;
    }
    location = /prototype/admin {
        return 301 /prototype/admin/;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
