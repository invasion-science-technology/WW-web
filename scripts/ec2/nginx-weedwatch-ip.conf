# Default server: works with Elastic IP or public DNS (no TLS). setup-web-server.sh --ip-only

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/weedwatch;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
